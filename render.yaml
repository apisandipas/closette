services:
  - type: web
    name: closette
    runtime: node
    repo: https://github.com/apisandipas/closette
    plan: starter
    region: ohio
    branch: main
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /
    domains:
      - closette.fit
    envVars:
      - key: NITRO_PRESET
        value: render-com
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: closette-db
          property: connectionString
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false

databases:
  - name: closette-db
    region: ohio
    plan: basic-256mb
    postgresMajorVersion: "17"
